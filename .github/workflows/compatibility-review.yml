name: Compatibility review gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'compatibility-catalog-v1.0.json'
      - 'Tool-Compatibility.ps1'
      - 'VERIFY-COMPATIBILITY.ps1'
      - 'VERIFY-MICROSOFT-CATALOG-SOURCES.ps1'
      - '.github/workflows/compatibility-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate catalog and fixtures
        shell: powershell
        run: |
          .\VERIFY-COMPATIBILITY.ps1 -SourceDirectory .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare catalog with official Microsoft sources
        shell: powershell
        run: |
          .\VERIFY-MICROSOFT-CATALOG-SOURCES.ps1 -SourceDirectory . -OutputFile .\microsoft-catalog-review.json -FailOnReviewRequired
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload catalog review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microsoft-catalog-review
          path: microsoft-catalog-review.json
          if-no-files-found: warn
