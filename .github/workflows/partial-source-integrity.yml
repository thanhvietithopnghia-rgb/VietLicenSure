name: Partial source integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify controlled disclosure
        shell: pwsh
        run: ./VERIFY-PARTIAL-SOURCE.ps1
      - name: Verify signed Online catalog assets
        shell: pwsh
        run: ./.github/scripts/Verify-OnlineCatalog.ps1
